name: Script compile check

on:
  push:
    paths:
      - "Assets/**/*.cs"
      - ".github/ci/**"
      - ".github/workflows/script-check.yml"
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile game scripts against UnityEngine reference assemblies
        run: dotnet build .github/ci/ScriptCheck.csproj -c Release
