# 以 GameCI 在雲端建置 Android APK（手動觸發）。
# 需先在 GitHub → Settings → Secrets and variables → Actions 新增：
#   UNITY_LICENSE（Unity 個人授權 .ulf 檔內容）、UNITY_EMAIL、UNITY_PASSWORD
# 說明：https://game.ci/docs/github/activation
name: Android build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.27f1
          targetPlatform: Android
          buildMethod: RailwayMission.EditorTools.RailwayMissionEditor.BuildAndroid

      - uses: actions/upload-artifact@v4
        with:
          name: RailwayMission3D-Android
          path: Builds/Android
